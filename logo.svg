<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="Meerada">
  <defs>
    <style>
      .word { font: 800 76px "Archivo", "Segoe UI", Arial, sans-serif; letter-spacing: -2.5px; }
    </style>
  </defs>

  <!-- backdrop (remove this rect for a transparent version) -->
  <rect width="560" height="150" rx="18" fill="#0B1020"/>

  <!-- the eye: two handshake arcs meet — outgoing (teal) above, incoming (amber) below -->
  <g transform="translate(28,23)">
    <path d="M6 52 Q52 4 98 52" fill="none" stroke="#63CFC2" stroke-width="9" stroke-linecap="round"/>
    <path d="M6 52 Q52 100 98 52" fill="none" stroke="#F2B84B" stroke-width="9" stroke-linecap="round"/>
    <!-- iris = the grade ring (a score of ~80) -->
    <circle cx="52" cy="52" r="21" fill="none" stroke="#22304F" stroke-width="7"/>
    <circle cx="52" cy="52" r="21" fill="none" stroke="#F2B84B" stroke-width="7"
            pathLength="100" stroke-dasharray="80 100" stroke-linecap="round"
            transform="rotate(-90 52 52)"/>
    <!-- pupil -->
    <circle cx="52" cy="52" r="8.5" fill="#63CFC2"/>
  </g>

  <!-- wordmark: the double-e is the pair of eyes -->
  <text x="168" y="101" class="word" fill="#E9EEF9">m<tspan fill="#63CFC2">ee</tspan>rada</text>
  <text x="170" y="128" fill="#92A2BE" font-family="'IBM Plex Mono', Consolas, monospace" font-size="15" letter-spacing="3">THE WATCHFUL EYE ON YOUR AI</text>
</svg>
