# One-click deploy of the hosted LLManager to Render (free tier).
# Render injects PORT; the Dockerfile CMD binds to it. Set the three OAuth
# secrets in the dashboard (SESSION_SECRET is generated for you).
services:
  - type: web
    name: meerada-llmanager
    runtime: docker
    plan: free
    healthCheckPath: /me
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
