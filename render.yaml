# One-click deploy of the hosted LLManager to Render (free tier).
# Render injects PORT; the Dockerfile CMD binds to it.
#
# DEFAULT = tester mode: set GROQ_API_KEY (a free key from console.groq.com) and
# the dashboard serves REAL answers to anyone with the link — no sign-up, no
# per-user keys. Share the URL with your tester group, not publicly (it uses your
# shared Groq quota).
#
# To switch on real Google sign-in + per-user encrypted key vaults, add the four
# auth vars from docs/DEPLOY.md (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# OAUTH_REDIRECT_URI, SESSION_SECRET) — the app enforces auth the moment
# SESSION_SECRET is set.
services:
  - type: web
    name: meerada-llmanager
    runtime: docker
    plan: free
    healthCheckPath: /me
    envVars:
      - key: GROQ_API_KEY
        sync: false
