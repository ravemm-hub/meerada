<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited — Meerada</title>
  <meta name="description" content="A friend invited you to a real activity on Meerada. Open it in the app, or install Meerada to see the details and join." />
  <meta property="og:title" content="You're invited to an activity on Meerada" />
  <meta property="og:description" content="Real place, real time. Open in Meerada or install to join." />
  <meta property="og:image" content="https://meerada.app/assets/og.png" />
  <style>
    :root { --bg:#0E0D16; --card:#17162A; --text:#F2F1FF; --gray:#9A98B8; --primary:#6C63FF; --teal:#00BFA6; --border:#2A2947; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.55; }
    .wrap { max-width:560px; margin:0 auto; padding:22px 18px 60px; }
    .logo img { height:40px; }
    .card { margin-top:18px; background:var(--card); border:1px solid var(--border); border-radius:22px; overflow:hidden; }
    .cover { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#221f3a; }
    .body { padding:18px; }
    .tag { display:inline-block; font-size:12px; font-weight:800; color:var(--teal); letter-spacing:.4px; text-transform:uppercase; }
    h1 { font-size:24px; font-weight:900; margin-top:6px; line-height:1.25; }
    .meta { color:var(--gray); font-size:14px; margin-top:8px; }
    .desc { margin-top:12px; font-size:15px; opacity:.94; }
    .count { margin-top:12px; font-size:14px; }
    .count b { color:var(--primary); }
    .cta { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
    .btn { display:block; text-align:center; padding:15px 16px; border-radius:16px; font-weight:900; text-decoration:none; font-size:16px; cursor:pointer; }
    .btn.primary { background:linear-gradient(135deg,#6E63F0,#9A6BFF); color:#fff; }
    .btn.store { background:#201e36; color:var(--text); border:1px solid var(--border); }
    .muted { color:var(--gray); font-size:12.5px; margin-top:16px; }
    .he { direction:rtl; text-align:right; }
    .lang { margin-top:10px; font-size:13px; }
    .lang a { color:var(--gray); text-decoration:none; margin-right:10px; }
    .lang a.on { color:var(--text); font-weight:800; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="tribes.html"><img src="assets/meerada-tribes-wordmark.png" alt="Meerada" /></a>
    <div class="lang"><a href="#" data-lang="en" class="on">English</a><a href="#" data-lang="he">עברית</a></div>

    <div class="card">
      <img id="cover" class="cover" alt="" />
      <div class="body">
        <span class="tag" data-en="You're invited" data-he="הוזמנת">You're invited</span>
        <h1 id="name">Loading the activity…</h1>
        <div class="meta" id="meta"></div>
        <div class="desc" id="desc"></div>
        <div class="count" id="count"></div>
        <div class="cta">
          <a id="openApp" class="btn primary" href="#" data-en="Open in Meerada" data-he="פתיחה במירדה">Open in Meerada</a>
          <a id="android" class="btn store" href="https://play.google.com/store/apps/details?id=com.tryber.social" data-en="Android · install from Google Play" data-he="אנדרואיד · התקנה מ-Google Play">Android · install from Google Play</a>
          <a id="ios" class="btn store" href="https://apps.apple.com/app/id6780445573" data-en="iPhone · App Store" data-he="אייפון · App Store">iPhone · App Store</a>
        </div>
        <p class="muted" data-en="Already have Meerada? “Open in Meerada” takes you straight into this activity. Installing now? After you sign up, the app opens this activity for you." data-he="כבר יש לכם מירדה? ״פתיחה במירדה״ מכניסה ישר לפעילות הזו. מתקינים עכשיו? אחרי ההרשמה האפליקציה תפתח לכם את הפעילות.">Already have Meerada? “Open in Meerada” takes you straight into this activity. Installing now? After you sign up, the app opens this activity for you.</p>
      </div>
    </div>
  </div>
<script>
(function () {
  var SB = 'https://vytkiwibuohtcmjmslkh.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dGtpd2lidW9odGNtam1zbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODIwNDUsImV4cCI6MjA5MDk1ODA0NX0.jgggUmp5stzW-9QKLjtrVJdQE4MBbKaFLuySZjgi-ds';
  var q = new URLSearchParams(location.search);
  var id = q.get('a') || q.get('id') || '';
  var by = q.get('by') || '';
  var okId = /^[0-9a-f-]{36}$/i.test(id), okBy = /^[0-9a-f-]{36}$/i.test(by);
  var lang = (q.get('lang') || (navigator.language || 'en').slice(0, 2)) === 'he' ? 'he' : 'en';
  function applyLang() {
    document.documentElement.lang = lang;
    document.body.classList.toggle('he', lang === 'he');
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-' + lang) || el.getAttribute('data-en'); });
    document.querySelectorAll('.lang a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-lang') === lang); });
  }
  document.querySelectorAll('.lang a').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); lang = a.getAttribute('data-lang'); applyLang(); render(window.__ev); }); });

  // Deep link into the activity room; the inviter rides along so the app records the invite.
  var deep = 'trybe://chat?id=' + encodeURIComponent(id) + (okBy ? '&by=' + encodeURIComponent(by) : '');
  var openBtn = document.getElementById('openApp');
  openBtn.setAttribute('href', deep);

  // Deferred deep link for a fresh install: stash the invite on the clipboard inside
  // the store tap (a user gesture), then follow the store link.
  var token = okId && okBy ? 'meerada-invite:' + id.toLowerCase() + ':' + by.toLowerCase() : '';
  ['android', 'ios'].forEach(function (k) {
    var a = document.getElementById(k);
    a.addEventListener('click', function (e) {
      if (!token) return;
      e.preventDefault();
      var href = a.getAttribute('href');
      var go = function () { location.href = href; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(token).then(go, go);
        else go();
      } catch (err) { go(); }
    });
  });

  // Auto-attempt the app on mobile; if nothing takes focus away, the page simply stays.
  var mobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if (okId && mobile) {
    setTimeout(function () {
      var f = document.createElement('iframe');
      f.style.display = 'none'; f.src = deep; document.body.appendChild(f);
      setTimeout(function () { try { document.body.removeChild(f); } catch (e) {} }, 2000);
    }, 400);
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString(lang === 'he' ? 'he-IL' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; }
  }
  function render(ev) {
    applyLang();
    if (!ev) return;
    document.title = ev.name + ' — Meerada';
    document.getElementById('name').textContent = ev.name || '';
    var parts = [];
    if (ev.event_at) parts.push('📅 ' + fmtDate(ev.event_at));
    if (ev.location_name) parts.push('📍 ' + ev.location_name);
    document.getElementById('meta').textContent = parts.join('   ·   ');
    document.getElementById('desc').textContent = ev.description || '';
    var n = ev.member_count || 0;
    document.getElementById('count').innerHTML = n > 0 ? (lang === 'he' ? '<b>' + n + '</b> כבר בפנים' : '<b>' + n + '</b> already in') : '';
    var c = document.getElementById('cover');
    if (ev.cover_url) { c.src = ev.cover_url; c.style.display = 'block'; } else { c.style.display = 'none'; }
  }
  applyLang();
  if (!okId) { document.getElementById('name').textContent = lang === 'he' ? 'הפעילות לא נמצאה' : 'Activity not found'; return; }
  fetch(SB + '/rest/v1/groups?id=eq.' + id + '&select=name,description,event_at,location_name,cover_url,member_count', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { return r.json(); })
    .then(function (rows) { window.__ev = rows && rows[0]; if (!window.__ev) document.getElementById('name').textContent = lang === 'he' ? 'הפעילות לא נמצאה' : 'Activity not found'; else render(window.__ev); })
    .catch(function () { document.getElementById('name').textContent = lang === 'he' ? 'שגיאה בטעינה' : 'Could not load the activity'; });
})();
</script>
</body>
</html>
