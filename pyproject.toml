[project]
name = "handover"
version = "0.1.0"
description = "Measures LLM workloads by completed verified task and migrates workloads between models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "arq>=0.26",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
meerada = "handover.cli.main:app"
hv = "handover.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handover"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["handover"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "arq.*", "jsonschema.*", "sklearn.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
