<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<!-- Meerada in-app player page. The app's WebView loads THIS page (a real https
     document on meerada.app) and the page hosts the official YouTube iframe, so
     the embed request carries a genuine Referer — YouTube refuses embeds without
     one (error 153 "Video player configuration error"). Query: ?yt=<videoId>
     [&autoplay=1][&mute=1][&controls=0][&loop=1].
     v2 (11-03): youtube-nocookie.com host (the privacy-enhanced embed is the one
     reported to survive strict referrer setups), the IFrame API reports player
     errors to the app (ReactNativeWebView.postMessage {type:'yt_error',code}) so the
     card can offer "Open in YouTube", and a visible fallback link on this page too. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Meerada player</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#ccc;font:14px -apple-system,Roboto,sans-serif;text-align:center;padding:20px;background:#000}
  #err a{color:#fff;background:#FF0000;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:20px}
</style>
</head>
<body>
<div id="err"><div id="errText">This video can't be played here.</div><a id="open" href="#" target="_blank" rel="noopener">▶ Open in YouTube</a></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var id = (q.get('yt') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
  var errBox = document.getElementById('err'), open = document.getElementById('open');
  function post(msg) { try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {} }
  function fail(code) {
    document.getElementById('errText').textContent = code ? 'This video can’t be played in the app (error ' + code + ').' : 'This video can’t be played here.';
    open.href = 'https://www.youtube.com/watch?v=' + id;
    errBox.style.display = 'flex';
    post({ type: 'yt_error', code: code || 0, id: id });
  }
  if (id.length !== 11) { fail(0); return; }
  var p = new URLSearchParams({ playsinline: '1', rel: '0', modestbranding: '1', enablejsapi: '1', origin: location.origin,
    controls: q.get('controls') === '0' ? '0' : '1' });
  if (q.get('autoplay') === '1') p.set('autoplay', '1');
  if (q.get('mute') === '1') p.set('mute', '1');
  if (q.get('loop') === '1') { p.set('loop', '1'); p.set('playlist', id); }
  var f = document.createElement('iframe');
  f.id = 'yt';
  f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?' + p.toString();
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  document.body.appendChild(f);
  // IFrame API: hear the player's own error (2 bad id · 5 html5 · 100 removed · 101/150 not
  // embeddable · 153 referer) and surface a way out instead of a frozen black box.
  window.onYouTubeIframeAPIReady = function () {
    try {
      new YT.Player('yt', { events: {
        onReady: function () { post({ type: 'yt_ready', id: id }); },
        onStateChange: function (e) { post({ type: 'yt_state', state: e.data, id: id }); },
        onError: function (e) { fail(e.data); }
      } });
    } catch (e) {}
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { /* API blocked — the plain iframe still plays */ };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
