name: pilots-weekly

# The pilots' proof round: every Monday, the pilot questions are asked 7 times on every
# engine the server has a key for (the engines are volatile; one answer proves nothing),
# the stored answers are re-read with the current extractor, and the pages, gap pages and
# the test-case page are rebuilt and published next to the daily run.
on:
  schedule:
    - cron: "0 5 * * 1"       # Mondays, 05:00 UTC (before the daily 06:30 tick)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: visibility-monitor   # never overlap the daily tick on the same state file
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    environment: meeraba
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e .

      - name: fetch prior answers from gh-pages
        run: |
          git fetch origin gh-pages || true
          git show origin/gh-pages:visibility_state.json > visibility_state.json 2>/dev/null || echo '{}' > visibility_state.json

      - name: ask the pilot questions 7 times each
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        # 5 questions x 7 runs x up to 5 engines = 175 answers; worst case ~$7, capped at 8.
        run: |
          mkdir -p out
          ONLY=$(python -c "import json; print(','.join(sorted({q for e in json.load(open('data/experiments.json', encoding='utf-8'))['experiments'] for q in e['queries']})))")
          echo "pilot questions: $ONLY"
          python -m handover.visibility.run \
            --state visibility_state.json \
            --out out/visibility.html --json out/visibility.json --cases out/cases.html \
            --engines chatgpt,chatgpt5,perplexity,gemini,claude \
            --only "$ONLY" --runs 7 --per-tick 20 --budget "8.00" --reextract
          python -m handover.cli.main visibility pages --state visibility_state.json --out out/s
          python -m handover.cli.main visibility gap --state visibility_state.json --out out/gap
          python -m handover.cli.main visibility pilots --state visibility_state.json --out out/pilots

      - name: publish to gh-pages
        run: |
          git config user.name "meerada-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
          cp out/visibility.html pages/visibility.html
          cp out/cases.html pages/cases.html
          cp out/visibility.json pages/visibility.json
          cp visibility_state.json pages/visibility_state.json
          mkdir -p pages/s && cp out/s/* pages/s/
          mkdir -p pages/gap && cp out/gap/* pages/gap/
          mkdir -p pages/pilots && cp out/pilots/pilots.json pages/pilots/   # numbers only; the mail drafts stay in the run
          cd pages
          git add visibility.html cases.html visibility.json visibility_state.json s gap pilots
          git commit -m "pilots round $(date -u +%FT%RZ)" || echo "no change"
          git push origin HEAD:gh-pages
