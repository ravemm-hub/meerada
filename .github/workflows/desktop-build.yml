name: desktop-build

# Builds the Meerada LLManager desktop app. Windows gets a real installer
# (MeeradaSetup.exe — Start-menu + desktop shortcuts, uninstaller, no admin);
# macOS/Linux get a zipped app folder. Trigger by hand (Actions -> desktop-build
# -> Run workflow) or by pushing a v* tag (which also attaches to a Release).
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Meerada-Windows-Installer
          - os: macos-latest
            artifact: Meerada-macOS
          - os: ubuntu-latest
            artifact: Meerada-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" pyinstaller

      # A --onedir build launches instantly (no per-run temp extraction) and is far
      # less likely to trip antivirus than --onefile.
      - name: Build (onedir)
        run: >
          pyinstaller --name Meerada --windowed --onedir
          --collect-all handover --collect-all webview
          packaging/app_entry.py

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Zip app (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r "../Meerada-${{ runner.os }}.zip" Meerada

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/MeeradaSetup.exe
          if-no-files-found: error

      - name: Upload app zip (macOS / Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Meerada-*.zip
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            installer/MeeradaSetup.exe
            Meerada-*.zip
