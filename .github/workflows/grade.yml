name: live-grade

# The living index: grade models on a schedule and redeploy the board.
# State (grade_state.json) lives on the gh-pages branch next to the board.
on:
  schedule:
    - cron: "0 * * * *"      # hourly
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

concurrency:
  group: live-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e .

      - name: fetch prior state from gh-pages
        run: |
          git fetch origin gh-pages || true
          git show origin/gh-pages:grade_state.json > grade_state.json 2>/dev/null || echo '{}' > grade_state.json

      - name: run one grading tick
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p out
          python -m handover.bench.continuous_run \
            --state grade_state.json \
            --board out/grade.html \
            --providers groq,openrouter,deepseek,mistral,openai \
            --budget "1.00"

      - name: publish board + state to gh-pages
        run: |
          git config user.name "meerada-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
          cp out/grade.html pages/grade.html
          cp grade_state.json pages/grade_state.json
          cd pages
          git add grade.html grade_state.json
          git commit -m "live grade $(date -u +%FT%RZ)" || echo "no change"
          git push origin HEAD:gh-pages
