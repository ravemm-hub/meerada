name: live-grade

# The living index: grade models on a schedule and redeploy the board.
# Runs only when at least one provider key is set as a repo secret.
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch: {}    # manual trigger

permissions:
  contents: write

concurrency:
  group: live-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state          # a lightweight branch that holds grade_state.json
          fetch-depth: 1
        continue-on-error: true

      - uses: actions/checkout@v4    # fall back to main if the state branch is new
        if: ${{ failure() }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e .

      - name: run one grading tick
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p site
          python -m handover.bench.continuous_run \
            --state grade_state.json \
            --board site/grade.html \
            --providers groq,openrouter,deepseek,mistral,openai \
            --budget "${MEERADA_DAILY_BUDGET:-1.00}"

      - name: publish board + persist state
        run: |
          git config user.name "meerada-bot"
          git config user.email "bot@meerada.local"
          # commit the refreshed board to gh-pages
          git fetch origin gh-pages || true
          git worktree add -B gh-pages .ghpages origin/gh-pages 2>/dev/null || git worktree add .ghpages gh-pages
          cp site/grade.html .ghpages/grade.html
          ( cd .ghpages && git add grade.html && \
            git commit -m "live grade $(date -u +%FT%RZ)" && git push origin gh-pages ) || true
          # persist state on its own branch
          git worktree add -B state .state 2>/dev/null || git worktree add .state state
          cp grade_state.json .state/grade_state.json
          ( cd .state && git add grade_state.json && \
            git commit -m "state $(date -u +%FT%RZ)" && git push -f origin state ) || true
